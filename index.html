<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modular Menu Designer</title>
    <link rel="stylesheet" href="styles.css?v=70">
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></symbol>
      <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v2"/><path d="M3 19.5 5.6 11h16L19 21H5a2 2 0 0 1-2-1.5Z"/></symbol>
      <symbol id="i-rotate-ccw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5"/><path d="M14 11v5"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
      <symbol id="i-clipboard" viewBox="0 0 24 24"><path d="M9 4h6"/><path d="M9 4a3 3 0 0 0 6 0"/><path d="M8 6H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m18 6-12 12"/><path d="m6 6 12 12"/></symbol>
      <symbol id="i-align-left" viewBox="0 0 24 24"><path d="M6 4v16"/><path d="M10 8h8"/><path d="M10 16h6"/></symbol>
      <symbol id="i-align-center-h" viewBox="0 0 24 24"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M8 16h8"/></symbol>
      <symbol id="i-align-right" viewBox="0 0 24 24"><path d="M18 4v16"/><path d="M6 8h8"/><path d="M8 16h6"/></symbol>
      <symbol id="i-align-top" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M8 10v8"/><path d="M16 10v6"/></symbol>
      <symbol id="i-align-center-v" viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M8 6v12"/><path d="M16 8v8"/></symbol>
      <symbol id="i-align-bottom" viewBox="0 0 24 24"><path d="M4 18h16"/><path d="M8 6v8"/><path d="M16 8v6"/></symbol>
      <symbol id="i-width" viewBox="0 0 24 24"><path d="M4 7v10"/><path d="M20 7v10"/><path d="M7 12h10"/><path d="m9 9-3 3 3 3"/><path d="m15 9 3 3-3 3"/></symbol>
      <symbol id="i-height" viewBox="0 0 24 24"><path d="M7 4h10"/><path d="M7 20h10"/><path d="M12 7v10"/><path d="m9 9 3-3 3 3"/><path d="m9 15 3 3 3-3"/></symbol>
      <symbol id="i-fill-right" viewBox="0 0 24 24"><path d="M5 5v14"/><path d="M19 5v14"/><path d="M8 12h8"/><path d="m13 9 3 3-3 3"/></symbol>
      <symbol id="i-fill-down" viewBox="0 0 24 24"><path d="M5 5h14"/><path d="M5 19h14"/><path d="M12 8v8"/><path d="m9 13 3 3 3-3"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5"/><path d="M16 3h5v5"/><path d="M8 21H3v-5"/><path d="M16 21h5v-5"/><path d="M3 3l7 7"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/><path d="M21 21l-7-7"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></symbol>
      <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    </svg>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Menu Builder</p>
          <h1>模块化菜单编辑器</h1>
        </div>
        <div class="topbar-actions">
          <label class="zoom-control" for="zoomRange">
            <span>缩放</span>
            <input id="zoomRange" type="range" min="20" max="300" step="5" value="100">
            <strong id="zoomValue">100%</strong>
          </label>
          <button class="icon-button" id="centerCanvas" title="回到画布中心" aria-label="回到画布中心"><svg class="icon"><use href="#i-expand"></use></svg></button>
          <label class="toggle-control" title="拖动和缩放时吸附到网格">
            <input id="snapToggle" type="checkbox" checked>
            <span>吸附</span>
          </label>
          <button class="icon-button" id="exportProject" title="保存工程" aria-label="保存工程"><svg class="icon"><use href="#i-save"></use></svg></button>
          <button class="icon-button" id="importProject" title="导入工程" aria-label="导入工程"><svg class="icon"><use href="#i-folder-open"></use></svg></button>
          <button class="icon-button" id="resetDemo" title="恢复示例数据" aria-label="恢复示例数据"><svg class="icon"><use href="#i-rotate-ccw"></use></svg></button>
          <select id="imageFormat" class="format-select" aria-label="导出图片格式">
            <option value="png">PNG</option>
            <option value="jpeg">JPEG</option>
          </select>
          <select id="colorSpace" class="format-select wide-format" aria-label="导出色彩空间">
            <option value="srgb">sRGB</option>
            <option value="cmyk">CMYK</option>
          </select>
          <select id="exportScale" class="format-select" aria-label="导出倍率">
            <option value="1">1x</option>
            <option value="2" selected>2x</option>
            <option value="3">3x</option>
          </select>
          <button id="exportImage" title="导出图片">导出图片</button>
          <button class="primary-button" id="printPdf" title="导出 PDF">导出 PDF</button>
          <input id="projectFile" type="file" accept="application/json,.json" hidden>
        </div>
      </header>

      <main class="workspace">
        <aside class="panel page-panel">
          <div class="panel-section">
            <label class="field-label" for="pageSelect">当前页面</label>
            <select id="pageSelect"></select>
          </div>

          <div class="panel-section compact-grid">
            <button class="icon-action" id="addPage" title="添加页面" aria-label="添加页面"><svg class="icon"><use href="#i-plus"></use></svg></button>
            <button class="icon-action danger" id="deletePage" title="删除页面" aria-label="删除页面"><svg class="icon"><use href="#i-trash"></use></svg></button>
          </div>

          <div class="panel-section">
            <h2>页面设置</h2>
            <div class="property-grid page-preset-grid">
              <div class="property-field">
                <label class="field-label" for="pageSettingsScope">设置范围</label>
                <select id="pageSettingsScope">
                  <option value="linked">联动所有</option>
                  <option value="current">仅当前页</option>
                </select>
              </div>
              <div class="property-field">
                <label class="field-label">页面内容</label>
                <input type="text" value="画布参数" disabled>
              </div>
            </div>
            <div class="property-grid page-preset-grid">
              <div class="property-field">
                <label class="field-label" for="pagePreset">打印尺寸</label>
                <select id="pagePreset">
                  <option value="custom">自定义</option>
                  <option value="a3">A3</option>
                  <option value="a4">A4</option>
                  <option value="a5">A5</option>
                  <option value="b4">B4</option>
                  <option value="b5">B5</option>
                </select>
              </div>
              <div class="property-field">
                <label class="field-label" for="pageOrientation">页面方向</label>
                <select id="pageOrientation">
                  <option value="landscape">横向</option>
                  <option value="portrait">竖向</option>
                </select>
              </div>
            </div>
            <div class="property-grid page-preset-grid">
              <div class="property-field">
                <label class="field-label" for="pageFoldMode">折叠方式</label>
                <select id="pageFoldMode">
                  <option value="none">不折叠</option>
                  <option value="bi">双折叠</option>
                  <option value="tri">三折叠</option>
                </select>
              </div>
              <div class="property-field">
                <label class="field-label">整张图纸</label>
                <input type="text" value="单页导出" disabled>
              </div>
            </div>
            <div class="property-grid">
              <div class="property-field">
                <label class="field-label" for="pageWidth">页面宽 px</label>
                <input id="pageWidth" type="number" min="100" max="5000" step="1">
              </div>
              <div class="property-field">
                <label class="field-label" for="pageHeight">页面高 px</label>
                <input id="pageHeight" type="number" min="100" max="5000" step="1">
              </div>
              <div class="property-field">
                <label class="field-label" for="pageMargin">页边距 px</label>
                <input id="pageMargin" type="number" min="0" max="180" step="1">
              </div>
            </div>
            <div class="property-grid fold-margin-grid" id="foldMarginGrid">
              <div class="property-field">
                <label class="field-label" for="foldMargin1">栏 1 边距</label>
                <input id="foldMargin1" type="number" min="0" max="120" step="1">
              </div>
              <div class="property-field">
                <label class="field-label" for="foldMargin2">栏 2 边距</label>
                <input id="foldMargin2" type="number" min="0" max="120" step="1">
              </div>
              <div class="property-field">
                <label class="field-label" for="foldMargin3">栏 3 边距</label>
                <input id="foldMargin3" type="number" min="0" max="120" step="1">
              </div>
            </div>
            <label class="field-label" for="pageBackgroundImage">页面背景图片</label>
            <div class="asset-row">
              <input id="pageBackgroundImage" type="file" accept="image/*">
              <button class="icon-action danger" id="clearPageBackground" title="清除背景" aria-label="清除背景"><svg class="icon"><use href="#i-x"></use></svg></button>
            </div>
          </div>

          <div class="panel-section">
            <div class="panel-row">
              <h2>模块</h2>
              <button class="icon-action" id="addSection" title="添加模块" aria-label="添加模块"><svg class="icon"><use href="#i-plus"></use></svg></button>
            </div>
            <div id="sectionList" class="section-list"></div>
          </div>

        </aside>

        <section class="canvas-wrap">
          <div id="menuCanvas" class="print-stage"></div>
        </section>

        <aside class="panel editor-panel">
          <div class="panel-row">
            <h2>编辑模块</h2>
            <div class="panel-tools">
              <button class="icon-action" id="copySection" title="复制模块" aria-label="复制模块"><svg class="icon"><use href="#i-copy"></use></svg></button>
              <button class="icon-action" id="pasteSection" title="粘贴模块" aria-label="粘贴模块"><svg class="icon"><use href="#i-clipboard"></use></svg></button>
              <button class="icon-action danger" id="deleteSection" title="删除模块" aria-label="删除模块"><svg class="icon"><use href="#i-trash"></use></svg></button>
            </div>
          </div>
          <div id="sectionEditor"></div>
        </aside>
      </main>
    </div>

    <dialog id="newPageDialog" class="app-dialog">
      <form id="newPageForm" method="dialog">
        <div class="dialog-head">
          <div>
            <p class="eyebrow">New Page</p>
            <h2>新建空白页</h2>
          </div>
          <button class="icon-action" value="cancel" formmethod="dialog" title="关闭" aria-label="关闭"><svg class="icon"><use href="#i-x"></use></svg></button>
        </div>
        <div class="dialog-body">
          <label class="field-label" for="newPageName">页面名称</label>
          <input id="newPageName" type="text" value="New Page">
          <div class="property-grid page-preset-grid">
            <div class="property-field">
              <label class="field-label" for="newPagePreset">打印尺寸</label>
              <select id="newPagePreset">
                <option value="custom">自定义</option>
                <option value="a3">A3</option>
                <option value="a4">A4</option>
                <option value="a5">A5</option>
                <option value="b4">B4</option>
                <option value="b5">B5</option>
              </select>
            </div>
            <div class="property-field">
              <label class="field-label" for="newPageOrientation">页面方向</label>
              <select id="newPageOrientation">
                <option value="landscape">横向</option>
                <option value="portrait">竖向</option>
              </select>
            </div>
          </div>
          <div class="property-grid">
            <div class="property-field">
              <label class="field-label" for="newPageWidth">页面宽 px</label>
              <input id="newPageWidth" type="number" min="100" max="5000" step="1">
            </div>
            <div class="property-field">
              <label class="field-label" for="newPageHeight">页面高 px</label>
              <input id="newPageHeight" type="number" min="100" max="5000" step="1">
            </div>
            <div class="property-field">
              <label class="field-label" for="newPageMargin">页边距 px</label>
              <input id="newPageMargin" type="number" min="0" max="180" step="1">
            </div>
          </div>
          <div class="property-grid page-preset-grid">
            <div class="property-field">
              <label class="field-label" for="newPageFoldMode">折叠方式</label>
              <select id="newPageFoldMode">
                <option value="none">不折叠</option>
                <option value="bi">双折叠</option>
                <option value="tri">三折叠</option>
              </select>
            </div>
            <div class="property-field">
              <label class="field-label">页面内容</label>
              <input type="text" value="空白页" disabled>
            </div>
          </div>
        </div>
        <div class="dialog-actions">
          <button value="cancel" formmethod="dialog">取消</button>
          <button class="primary-button" id="confirmNewPage" value="default">创建</button>
        </div>
      </form>
    </dialog>

    <script src="vendor/html2canvas.min.js"></script>
    <script src="app.js?v=70"></script>
  </body>
</html>
